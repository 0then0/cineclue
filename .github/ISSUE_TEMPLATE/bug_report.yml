name: Bug report
description: Report a reproducible problem with the game or self-hosting.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a report. English and Russian reports are welcome.
        Do not include tokens, cookies, database URLs or private data. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the game mode, interface language and relevant film titles. Mark Daily answers as spoilers.
      placeholder: |
        1. Open Unlimited mode
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/version, operating system, screen size if relevant; hosted site or local setup. For self-hosting, include the commit/tag, Node.js and PostgreSQL versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted logs
      description: Remove secrets, cookies, connection strings and personal data before posting.
